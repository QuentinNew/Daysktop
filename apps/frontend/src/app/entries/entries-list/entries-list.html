<div class="page">
  <h1>Entries</h1>

  @if (isSearch) {
    <app-text-tile class="search-panel" color="var(--mat-sys-secondary)" [width]="288">
      <app-entry-search-panel [(keyword)]="searchKeyword" [(activityIds)]="searchActivityIds" />
    </app-text-tile>
  }

  @if (entryViewModels().length === 0) {
    <p>{{ isSearch ? 'No entries found.' : 'No entries yet.' }}</p>
  } @else {
    <div class="entries">
      <div #topSentinel class="entries__sentinel"></div>
      @for (entry of visibleEntries(); track entry.id) {
        <app-entry
          [width]="720"
          [date]="entry.date"
          [moodFace]="entry.moodFace"
          [moodColor]="entry.moodColor"
          [moodName]="entry.moodName"
          [activities]="entry.activities"
          [note]="entry.note"
        />
      }
      <div #bottomSentinel class="entries__sentinel"></div>
    </div>

    @if (showScrollBar()) {
      <app-scroll-bar [progress]="scrollProgress()" (progressChange)="onScrollBarChange($event)" />
    }
  }
</div>
