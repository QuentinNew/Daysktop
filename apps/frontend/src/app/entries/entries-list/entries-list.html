<div class="page">
  <h1>Entries</h1>

  @if (entryViewModels().length === 0) {
    <p>No entries yet.</p>
  } @else {
    <div class="entries">
      @for (entry of entryViewModels(); track entry.id) {
        <app-entry
          [width]="720"
          [date]="entry.date"
          [moodFace]="entry.moodFace"
          [moodColor]="entry.moodColor"
          [moodName]="entry.moodName"
          [activities]="entry.activities"
          [note]="entry.note"
        />
      }
    </div>
  }
</div>
