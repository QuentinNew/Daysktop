<div class="calendar-page-layout">
  <div class="calendar-page">
    <div class="calendar-page__header">
      <app-search-bar>
      </app-search-bar>
    </div>
    <div class="calendar-page__main">
      <div class="calendar-page__entry">
        @if (selectedEntry(); as entry) {
          <app-entry
            [date]="entry.date"
            [moodFace]="entry.moodFace"
            [moodColor]="entry.moodColor"
            [moodName]="entry.moodName"
            [activities]="entry.activities"
            [note]="entry.note"
          />
        }
      </div>

        <app-calendar
          [date]="calendarDate()"
          [earliest]="earliest()"
          [latest]="latest()"
          [entries]="calendarEntries()"
          (dateChange)="changeMonth($event)"
          (daySelect)="selectDay($event)"
        />

      <app-text-tile class="calendar-page__media" color="var(--mat-sys-secondary)" [width]="288">
        <div class="calendar-page__media-grid">
          @for (item of mediaGridItems; track $index) {
            @if (item) {
              <app-media-card [image]="item.image" [name]="item.name" [size]="120" />
            } @else {
              <app-tile [width]="120" [height]="120" color="var(--mat-sys-surface-variant)" />
            }
          }
        </div>
      </app-text-tile>
      </div>
  </div>

  <app-page-menubar />
</div>
