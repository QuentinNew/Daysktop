<div class="calendar-page-layout">
  <div class="calendar-page">
    <div class="calendar-page__header">
    </div>
    <div class="calendar-page__main">
      <div class="calendar-page__entry">
        @if (selectedEntry(); as entry) {
          <app-entry
            [date]="entry.date"
            [moodFace]="entry.moodFace"
            [moodColor]="entry.moodColor"
            [moodName]="entry.moodName"
            [activities]="entry.activities"
            [note]="entry.note"
          />
        }
      </div>

        <app-calendar
          [date]="calendarDate()"
          [earliest]="earliest()"
          [latest]="latest()"
          [entries]="calendarEntries()"
          [highlightedDates]="highlightedDates()"
          (dateChange)="changeMonth($event)"
          (daySelect)="selectDay($event)"
        />

      <app-text-tile class="calendar-page__side-panel" color="var(--mat-sys-secondary)" [width]="288">
        <app-tabs [labels]="mediaTabs" [selected]="selectedMediaTab()" (selectedChange)="selectedMediaTab.set($event)" />

        @if (selectedMediaTab() === 0) {
          <div class="calendar-page__side-panel-header">
            <app-button variant="text" [iconOnly]="true" (click)="toggleMediaEditMode()">
              <app-icon name="pencil" />
            </app-button>
          </div>
          <div class="calendar-page__side-panel-grid">
            @for (item of mediaGridItems(); track item.id) {
              <app-media-card
                [image]="item.picture"
                [name]="item.name"
                [size]="120"
                [zoom]="item.zoom"
                [focalX]="item.focalX"
                [focalY]="item.focalY"
                [noText]="true"
                [deletable]="mediaEditMode()"
                (deleteClick)="removeMediaFromMonth(item)"
                (click)="mediaEditMode() && openMediaPicker(item)"
              />
            }
            @if (mediaEditMode()) {
              <button type="button" class="calendar-page__side-panel-add" (click)="openMediaPicker()" aria-label="Add media">
                <app-icon name="circle-plus" [size]="32" />
              </button>
            }
          </div>
        }

        @if (selectedMediaTab() === 1) {
          <div class="calendar-page__side-panel-search">
            <app-activity-picker
              class="calendar-page__side-panel-activities"
              [groups]="activityGroups()"
              [selected]="selectedActivityIdsList()"
              [multiple]="true"
              [maxHeight]="'480px'"
              (toggle)="toggleActivity($event)"
            />
            <div class="calendar-page__side-panel-search-bar">
              <app-search-bar
                [value]="searchKeyword()"
                placeholder="search"
                (valueChange)="searchKeyword.set($event)"
                (search)="onSearchSubmit($event)"
              />
              <app-button [iconOnly]="true" (click)="onSearchSubmit(searchKeyword())">
                <app-icon name="search" />
              </app-button>
            </div>
          </div>
        }

        @if (selectedMediaTab() === 2) {
          <div class="calendar-page__side-panel-chat">
            <div class="calendar-page__side-panel-chat-list" #chatContainer (scroll)="onChatScroll($event)">
              @for (message of chatMessages; track $index) {
                <app-speech-bubble
                  class="calendar-page__side-panel-chat-bubble"
                  [class.calendar-page__side-panel-chat-bubble--right]="message.color === 'dark'"
                  [color]="message.color"
                  [tailPosition]="message.tailPosition"
                >
                  {{ message.text }}
                </app-speech-bubble>
              }
            </div>
            <app-scroll-bar [progress]="chatScrollProgress()" (progressChange)="onChatScrollBarChange($event)" />
          </div>
        }
      </app-text-tile>
      </div>
  </div>
</div>
