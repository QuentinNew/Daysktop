<app-text-tile class="entry" color="var(--mat-sys-secondary)" [width]="width()">
  <app-text-tile class="entry__date-tab" [color]="moodColor()" [width]="240">
    {{ formattedDate() }}
  </app-text-tile>

  <div class="entry__header">
    <app-mood [face]="moodFace()" [color]="moodColor()" [size]="56" />

    <div class="entry__mood-info">
      <span class="entry__mood-name" [style.color]="moodColor()">{{ moodName() }}</span>

      <div class="entry__activities">
        @for (activity of activities(); track activity.label) {
          <app-activity-label [label]="activity.label" [icon]="activity.icon" />
        }
      </div>
    </div>
  </div>

  @if (note()) {
    <div class="entry__note-wrapper">
      <p class="entry__note" #noteContainer (scroll)="onNoteScroll($event)" [innerHTML]="note()"></p>
      @if (noteOverflows()) {
        <app-scroll-bar [progress]="noteScrollProgress()" (progressChange)="onNoteScrollBarChange($event)" />
      }
    </div>
  } @else {
    <p class="entry__note entry__note--empty">No note for this day</p>
  }
</app-text-tile>
