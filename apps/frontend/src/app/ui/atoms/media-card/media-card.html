<div class="media-card" [class.media-card--selected]="selected()">
  <app-tile [width]="size()" [height]="size()" color="var(--mat-sys-surface-variant)">
    <div class="media-card__frame">
      <img
        class="media-card__image"
        [src]="image()"
        [alt]="name()"
        [style.width.%]="framing().widthPercent"
        [style.height.%]="framing().heightPercent"
        [style.transform]="'translate(' + framing().translateXPercent + '%, ' + framing().translateYPercent + '%)'"
      />
    </div>
  </app-tile>

  @if (deletable()) {
    <button
      type="button"
      class="media-card__delete"
      aria-label="Delete"
      (click)="$event.stopPropagation(); deleteClick.emit()"
    ></button>
  }

  @if (!noText()) {
    <span class="media-card__name" [style.width.px]="size()">{{ name() }}</span>
  }
</div>
