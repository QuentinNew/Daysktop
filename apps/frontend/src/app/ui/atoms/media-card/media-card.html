<div class="media-card" [class.media-card--selected]="selected()">
  <app-tile [width]="size()" [height]="size()" color="var(--mat-sys-surface-variant)">
    <img class="media-card__image" [src]="image()" [alt]="name()" />
  </app-tile>

  @if (!noText()) {
    <span class="media-card__name" [style.width.px]="size()">{{ name() }}</span>
  }
</div>
