<div class="page">

  <div class="panels">
    <app-tile-with-title title="Moods" [width]="380">
      <div class="moods">
        <div class="moods__list">
          @for (mood of moods(); track mood.id) {
            <button
              type="button"
              class="moods__mood"
              [class.moods__mood--selected]="selectedMood()?.id === mood.id"
              (click)="selectMood(mood)"
            >
              <app-mood [face]="moodFace(mood)" [color]="moodColor(mood)" [size]="40" />
            </button>
          }
        </div>

        @if (selectedMood(); as mood) {
          <div class="moods__form">
            <app-tile class="moods__preview" color="#000000" [width]="90" [height]="90">
              <app-mood [face]="moodFace(mood)" [color]="selectedMoodColor()" [size]="64" />
            </app-tile>

            <div class="moods__grid">
              <app-text-field label="Name" [value]="selectedMoodName()" (valueChange)="onMoodNameChange($event)" />
              <app-color-picker label="Color" [value]="selectedMoodColor()" (valueChange)="onColorChange($event)" />
              <app-text-field label="ID" [value]="mood.id.toString()" />
              <app-text-field label="Face" variant="filled" [value]="moodFace(mood)" />
            </div>
          </div>

          <div class="moods__actions">
            <app-button variant="outlined" [disabled]="isSaving()" (click)="resetEdits()">
              Reset
            </app-button>
            <app-button [disabled]="isSaving()" (click)="save()">Save</app-button>
          </div>
        }
      </div>
    </app-tile-with-title>

    <app-tile-with-title title="Activities" [width]="380">
      <app-activity-picker
        [groups]="activityGroups()"
        [selected]="selectedActivity() ? [selectedActivity()!.id] : []"
        (toggle)="selectActivity($event)"
      />
    </app-tile-with-title>

    @if (selectedActivity(); as activity) {
      <div class="activity-edit">
        <div class="activity-edit__preview">
          <app-tile color="#000000" [width]="90" [height]="90">
            <app-icon [name]="selectedActivityIcon()" folder="activity" [size]="48" />
          </app-tile>
          <app-text-field label="Name" [value]="selectedActivityName()" (valueChange)="onActivityNameChange($event)" />
        </div>

        <div class="activity-edit__icons-wrapper">
          <div
            class="activity-edit__icons"
            #activityIconsContainer
            (scroll)="onActivityIconsScroll($event)"
          >
            @for (icon of activityIconChoices; track icon) {
              <button
                type="button"
                class="activity-edit__icon"
                [class.activity-edit__icon--selected]="selectedActivityIcon() === icon"
                (click)="onActivityIconChange(icon)"
              >
                <app-icon [name]="icon" folder="activity" [size]="24" />
              </button>
            }
          </div>

          <app-scroll-bar
            [progress]="activityIconsScrollProgress()"
            (progressChange)="onActivityIconsScrollBarChange($event)"
          />
        </div>

        <div class="moods__actions">
          <app-button variant="outlined" [disabled]="isSavingActivity()" (click)="resetActivityEdits()">
            Reset
          </app-button>
          <app-button [disabled]="isSavingActivity()" (click)="saveActivity()">Save</app-button>
        </div>
      </div>
    }
  </div>

  @if (editNotification(); as notification) {
    <app-notification
      class="page__notification"
      [variant]="notification.variant"
      [title]="notification.title"
    />
  }
</div>
