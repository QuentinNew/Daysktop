<div class="page">
  <h1>Settings</h1>
  <div class="settings-page__content">
    <app-tile-with-title title="Import / Export">
      <p>You can import your .dailyo file here.</p>
      <p>Accepted types : .daylio, .json, .zip</p>
      <input type="file" class="file-upload" (change)="onImportFileSelected($event)">
      <app-button [disabled]="importButtonDisabled()" (click)="onImport()">Import</app-button>

      <p>You can export all your data (entries and medias) as a backup file.</p>
      <app-button variant="outlined" (click)="onExport()">Export</app-button>
    </app-tile-with-title>
  </div>

  @if (notification(); as notification) {
    <app-notification
      class="settings-page__notification"
      [variant]="notification.variant"
      [title]="notification.title"
    />
  }
</div>
